name: B站每日任务

on:
  schedule:
    # UTC 16:05 = 北京时间 00:05。亲密度每天 0 点重置，卡在重置后立刻跑，
    # 点亮才算进「当天」。Actions 的 cron 不保证准时，忙的时候可能延后十几分钟，
    # 这些任务对时间不敏感，不影响结果。
    #
    # 2026-11-11 加第二槽（北京 12:05）：实测本 workflow 派发延迟中位 4.5 小时、
    # P90 5.8 小时。亲密度是「当天点亮的牌子数」，跑两趟不会多点，只是第一趟挂了
    # 还有一次机会。当天已有成功运行则 gate job 跳过；公开仓库不烧配额。
    - cron: '5 16 * * *'
    - cron: '5 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印计划，不发请求'
        type: boolean
        default: false
      max_light:
        description: '本次最多点亮多少枚牌子（默认 40，约 80 秒/账号；调大要同步放宽 timeout）'
        type: string
        default: '40'

permissions:
  contents: write
  # gate job 要读本 workflow 当天的运行记录
  actions: read

concurrency:
  group: bili-daily
  cancel-in-progress: false

jobs:
  # 补跑槽的守卫：今天已有成功运行就跳过。独立成 job 是为了不动下面任何一步。
  # 查询失败一律按「今天没跑过」处理：宁可多跑一趟，不能漏签。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.q.outputs.skip }}
    steps:
      - name: 查当天是否已有成功运行
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          now=$(date -u +%s)
          # 北京当天 00:00 对应的 UTC 时刻（纯算术，不吃时区数据库）
          day_start=$(( (now + 28800) / 86400 * 86400 - 28800 ))
          since=$(date -u -d "@$day_start" +%Y-%m-%dT%H:%M:%SZ)
          wf="${GITHUB_WORKFLOW_REF%@*}"
          wf="${wf##*/.github/workflows/}"
          n=$(curl -sS --max-time 15 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?per_page=50&created=%3E%3D${since}&status=success" \
              | jq --arg me "${GITHUB_RUN_ID}" '[.workflow_runs[]? | select((.id|tostring) != $me)] | length' 2>/dev/null) || n=""
          case "${n:-}" in ''|*[!0-9]*) echo "查询失败，按「今天没跑过」处理"; n=0 ;; esac
          echo "北京当天起点 ${since}；今天已成功 ${n} 次"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

  daily:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    # 常规 ~1 分钟（2 个账号 × 点亮 40 枚 × 2 秒间隔）。
    # 15 分钟是给「牌子特别多 / 网络抽风 / 接口重试」留的余量。
    # 注意：一旦被 timeout 杀掉，后面的 push 根本不会执行，那天一条推送都没有。
    # 所以想调大 MAX_LIGHT 就要同步放宽这里，别让「点亮」吃光预算。
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cookie 和认证日期缓存在这里，跨运行复用；cookie 失效时推送会提示重新扫码。
      # key 必须带 run_id（cache 一旦写入不可改），靠 restore-keys 前缀接上昨天的，
      # 所以每次运行都会新建一份 —— 这是官方推荐用法，旧份由 GitHub 自动淘汰。
      # 注意：实际只有 acctN_auth.json（首次认证日期）会被写入；
      # acctN_cookie.json 没有写入方，cookie 还是走 Secrets。
      - name: 恢复 cookie 缓存
        uses: actions/cache@v4
        with:
          path: .cookie-cache
          key: bili-cache-${{ github.run_id }}
          restore-keys: |
            bili-cache-

      # 掉线时要把登录二维码画成图推给微信，qrcode 是唯一的运行期依赖
      - name: 安装推送依赖
        run: npm install qrcode --no-save --no-audit --no-fund

      - name: 运行每日任务
        env:
          # 账号 cookie：由本机 `node scripts/qr-login.mjs --acct N --push` 扫码写入
          SESSDATA_1: ${{ secrets.SESSDATA_1 }}
          BILI_JCT_1: ${{ secrets.BILI_JCT_1 }}
          SESSDATA_2: ${{ secrets.SESSDATA_2 }}
          BILI_JCT_2: ${{ secrets.BILI_JCT_2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MAX_LIGHT: ${{ inputs.max_light || '40' }}
          DELAY_MS: '2000'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily.mjs

      # 直播挂机（观看亲密度）2026-10-26 整块下线：每枚牌子至少挂 15 分钟、
      # 4 枚并行也要 60 分钟，是这套 pipeline 里唯一的长任务，也是风控最敏感的部分。
      # 而且实测它给不了确定的收益（纯接口心跳上报 10 次只记 1 分钟时长）。
      # 详见 README「2026-10-26：直播挂机整块下线」。

      # GitHub 会在仓库连续 60 天无提交时自动停用 scheduled workflow。
      # 每月 1 号打一个空提交保活，避免悄悄停掉。
      - name: 保活（每月 1 号）
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push || true
          fi
