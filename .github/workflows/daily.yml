name: B站每日任务

on:
  schedule:
    # UTC 16:05 = 北京时间 00:05。亲密度每天 0 点重置，卡在重置后立刻跑，
    # 点亮才算进「当天」。Actions 的 cron 不保证准时，忙的时候可能延后十几分钟，
    # 这些任务对时间不敏感，不影响结果。
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印计划，不发请求'
        type: boolean
        default: false
      max_light:
        description: '本次最多点亮多少枚牌子（200 = 不限）'
        type: string
        default: '200'

permissions:
  contents: write

concurrency:
  group: bili-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # 直播挂机下线后整套只要 2~3 分钟（点亮 200 枚 × 2 秒间隔），
    # 15 分钟是给「牌子特别多 / 网络抽风 / 接口重试」留的余量，不是常规耗时。
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cookie 和认证日期缓存在这里，跨运行复用；cookie 失效时推送会提示重新扫码
      - name: 恢复 cookie 缓存
        uses: actions/cache@v4
        with:
          path: .cookie-cache
          key: bili-cache-${{ github.run_id }}
          restore-keys: |
            bili-cache-

      # 掉线时要把登录二维码画成图推给微信，qrcode 是唯一的运行期依赖
      - name: 安装推送依赖
        run: npm install qrcode --no-save --no-audit --no-fund

      - name: 运行每日任务
        env:
          # 账号 cookie：由本机 `node scripts/qr-login.mjs --acct N --push` 扫码写入
          SESSDATA_1: ${{ secrets.SESSDATA_1 }}
          BILI_JCT_1: ${{ secrets.BILI_JCT_1 }}
          SESSDATA_2: ${{ secrets.SESSDATA_2 }}
          BILI_JCT_2: ${{ secrets.BILI_JCT_2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MAX_LIGHT: ${{ inputs.max_light || '200' }}
          DELAY_MS: '2000'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily.mjs

      # 直播挂机（观看亲密度）2026-10-26 整块下线：每枚牌子至少挂 15 分钟、
      # 4 枚并行也要 60 分钟，是这套 pipeline 里唯一的长任务，也是风控最敏感的部分。
      # 而且实测它给不了确定的收益（纯接口心跳上报 10 次只记 1 分钟时长）。
      # 详见 README「2026-10-26：直播挂机整块下线」。

      # GitHub 会在仓库连续 60 天无提交时自动停用 scheduled workflow。
      # 每月 1 号打一个空提交保活，避免悄悄停掉。
      - name: 保活（每月 1 号）
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push || true
          fi
