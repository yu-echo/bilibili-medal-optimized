name: B站每日任务

on:
  schedule:
    # UTC 16:05 = 北京时间 00:05。亲密度每天 0 点重置，卡在重置后立刻跑，
    # 挂机那一轮才能拿到「当天」的 15 分钟额度。Actions 的 cron 不保证准时，
    # 忙的时候可能延后十几分钟，不影响结果。
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印计划，不发请求'
        type: boolean
        default: false
      max_light:
        description: '本次最多点亮多少枚牌子（200 = 不限）'
        type: string
        default: '200'
      watch_top:
        description: '每个账号最多挂几个直播间的观看任务（0 = 不挂）'
        type: string
        default: '4'

permissions:
  contents: write

concurrency:
  group: bili-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cookie 和认证日期缓存在这里，跨运行复用；cookie 失效时推送会提示重新扫码
      - name: 恢复 cookie 缓存
        uses: actions/cache@v4
        with:
          path: .cookie-cache
          key: bili-cache-${{ github.run_id }}
          restore-keys: |
            bili-cache-

      # 掉线时要把登录二维码画成图推给微信，qrcode 是唯一的运行期依赖
      - name: 安装推送依赖
        run: npm install qrcode --no-save --no-audit --no-fund

      - name: 运行每日任务
        env:
          # 账号 cookie：由本机 `node scripts/qr-login.mjs --acct N --push` 扫码写入
          SESSDATA_1: ${{ secrets.SESSDATA_1 }}
          BILI_JCT_1: ${{ secrets.BILI_JCT_1 }}
          SESSDATA_2: ${{ secrets.SESSDATA_2 }}
          BILI_JCT_2: ${{ secrets.BILI_JCT_2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MAX_LIGHT: ${{ inputs.max_light || '200' }}
          DELAY_MS: '2000'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily.mjs

      # 直播亲密度：对齐上游 BiliBiliToolPro 的 LiveFansMedal 任务
      # 只挂「开播中 + 已点亮 + 当天观看任务未满」的房间，高等级优先，多枚并行。
      # 2026-04 改版：观看满 15 分钟 +1 亲密度、每日上限 10 次，故每枚至少挂 15 分钟。
      # 挂机失败不影响前面的点亮结果（这一步单独失败也只是 job 标红）。
      - name: 直播观看亲密度（上游方案）
        if: ${{ (inputs.watch_top || '4') != '0' }}
        continue-on-error: true
        env:
          SESSDATA_1: ${{ secrets.SESSDATA_1 }}
          BILI_JCT_1: ${{ secrets.BILI_JCT_1 }}
          SESSDATA_2: ${{ secrets.SESSDATA_2 }}
          BILI_JCT_2: ${{ secrets.BILI_JCT_2 }}
          WATCH_TOP: ${{ inputs.watch_top || '4' }}
          WATCH_HEARTBEATS: '16'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/watch.mjs

      # GitHub 会在仓库连续 60 天无提交时自动停用 scheduled workflow。
      # 每月 1 号打一个空提交保活，避免悄悄停掉。
      - name: 保活（每月 1 号）
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push || true
          fi
