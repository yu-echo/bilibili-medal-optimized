name: B站每日任务

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00。避开整点，Actions 定时队列在整点最容易拥堵。
    # 亲密度每天 0 点重置，这里不卡零点：Actions 的 cron 本来就不保证准时，
    # 而且点亮/权益这些任务对时间不敏感。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印计划，不发请求'
        type: boolean
        default: false
      max_light:
        description: '本次最多点亮多少枚牌子'
        type: string
        default: '30'

permissions:
  contents: write

concurrency:
  group: bili-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cookie 和认证日期缓存在这里，跨运行复用；cookie 失效时推送会提示重新扫码
      - name: 恢复 cookie 缓存
        uses: actions/cache@v4
        with:
          path: .cookie-cache
          key: bili-cache-${{ github.run_id }}
          restore-keys: |
            bili-cache-

      - name: 运行每日任务
        env:
          # 账号 cookie：由本机 `node scripts/qr-login.mjs --acct N --push` 扫码写入
          SESSDATA_1: ${{ secrets.SESSDATA_1 }}
          BILI_JCT_1: ${{ secrets.BILI_JCT_1 }}
          SESSDATA_2: ${{ secrets.SESSDATA_2 }}
          BILI_JCT_2: ${{ secrets.BILI_JCT_2 }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          MAX_LIGHT: ${{ inputs.max_light || '30' }}
          DELAY_MS: '2000'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/daily.mjs

      # GitHub 会在仓库连续 60 天无提交时自动停用 scheduled workflow。
      # 每月 1 号打一个空提交保活，避免悄悄停掉。
      - name: 保活（每月 1 号）
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push || true
          fi
